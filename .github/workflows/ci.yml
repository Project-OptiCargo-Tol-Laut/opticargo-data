name: Data quality

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out data repository
        uses: actions/checkout@v4
        with:
          path: opticargo-data

      - name: Check out shared contracts
        uses: actions/checkout@v4
        with:
          repository: Project-OptiCargo-Tol-Laut/opticargo-shared
          ref: develop
          path: opticargo-shared

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: opticargo-data/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./opticargo-shared
          python -m pip install -r opticargo-data/requirements.txt ruff

      - name: Verify manifest and dataset contracts
        working-directory: opticargo-data
        run: |
          python -m seed.manifest --check
          python -m seed.validate

      - name: Run tests and lint
        working-directory: opticargo-data
        run: |
          python -m unittest discover -s tests -v
          ruff check seed tests
