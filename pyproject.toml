[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opticargo-data"
version = "3.2.0"
description = "OptiCargo deterministic datasets, validators, and one-off seed jobs"
requires-python = ">=3.11"
dependencies = [
  "opticargo-shared==1.0.0",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<24",
  "bcrypt>=4.1,<5",
  "boto3>=1.34,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["opticargo_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
